title: Team PJ
description: "Team PJ builds Interlock, which lets many AI coding agents work on one codebase without overwriting each other."
url: "https://team-pj-lab.github.io"
baseurl: ""
timezone: Asia/Seoul
markdown: kramdown
# Beta sign-up endpoint (e.g. a Formspree/Tally POST URL). Empty: the form opens a pre-filled email.
beta_form: ""
permalink: /board/:year/:month/:day/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: board
  - scope:
      path: "google08e1dfb6159df86a.html"
    values:
      sitemap: false

exclude:
  - README.md
